music_directory        "@@MUSIC@@"
playlist_directory     "@@HOME@@/.local/share/mpd/playlists"
db_file                "@@HOME@@/.local/share/mpd/database"
state_file             "@@HOME@@/.local/state/mpd/state"
sticker_file           "@@HOME@@/.local/share/mpd/sticker.sql"

bind_to_address        "127.0.0.1"
port                   "6600"
restore_paused         "yes"
auto_update            "yes"
zeroconf_enabled       "no"

input {
    plugin             "curl"
}

decoder {
    plugin             "wildmidi"
    enabled            "no"
}

audio_output {
    type               "pulse"
    name               "Warehouse-13 PipeWire-Pulse"
    mixer_type         "software"
}

filesystem_charset     "UTF-8"
