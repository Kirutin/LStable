#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = true
sort_fallback  = "alphabetical"
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
wrap          = "yes"
tab_size      = 2
max_width     = 1200
max_height    = 1800
image_delay   = 30
image_filter  = "triangle"
image_quality = 80

[opener]
edit = [
    { run = "kate %s", desc = "Mit Kate bearbeiten", for = "linux", orphan = true },
]
open = [
    { run = "xdg-open %s1", desc = "Öffnen", for = "linux", orphan = true },
]
play = [
    { run = "xdg-open %s1", desc = "Abspielen", for = "linux", orphan = true },
]
reveal = [
    { run = "dolphin --select %s1", desc = "In Dolphin zeigen", for = "linux", orphan = true },
]

[open]
prepend_rules = [
    { mime = "text/*", use = [ "edit", "reveal" ] },
    { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "reveal" ] },
]
