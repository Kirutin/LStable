name: Validate Lesbian Stable

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shell syntax
        run: bash -n scripts/*.sh sources/scripts/*.sh config-template/lesbian-stable/labwc/autostart
      - name: Shellcheck maintained entrypoints
        run: shellcheck scripts/install-lesbian-stable.sh scripts/deploy-lesbian-stable-config.sh scripts/07-install-noctalia-greeter.sh sources/scripts/build-lesbian-labwc-deb.sh
      - name: Parse configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          import xml.etree.ElementTree as ET
          for path in Path('config-template').rglob('*.toml'):
              tomllib.loads(path.read_text())
          for path in Path('config-template/lesbian-stable').rglob('*.xml'):
              ET.parse(path)
          PY
      - name: Check style-only boundary
        run: |
          test ! -d config-template/hyflair
          ! rg -n -i 'hyflair|cylab|overview|<regions|data-owner="hyflair' config-template/lesbian-stable sources/packaging/patches/labwc-lesbian
      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256
