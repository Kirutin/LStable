# Warehouse-13 / Lesbian Singularity rEFInd theme
# background.bmp is the firmware-safe 1920x1080 refindconnect wallpaper.

resolution max
use_graphics_for linux,grub,windows
hideui hints
showtools
enable_mouse
mouse_size 16
mouse_speed 32

icons_dir themes/rEFInd-lesbian-singularity/icons
banner themes/rEFInd-lesbian-singularity/background.bmp
banner_scale fillscreen

big_icon_size 192
small_icon_size 96

selection_small themes/rEFInd-lesbian-singularity/selection_small.png
selection_big themes/rEFInd-lesbian-singularity/selection_big.png
