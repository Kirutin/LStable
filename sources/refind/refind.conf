# Warehouse-13 / Lesbian Stable rEFInd configuration
# The Debian shim is on the same ESP as rEFInd, so no VM-specific PARTUUID is
# required.  This keeps the entry usable after a Rescuezilla migration.

include themes/rEFInd-lesbian-singularity/theme.conf

timeout 5
use_nvram false
scanfor manual
scan_all_linux_kernels false
default_selection "Lesbian Stable"

menuentry "Lesbian Stable" {
    icon \EFI\refind\themes\rEFInd-lesbian-singularity\icons\os_debian.png
    loader \EFI\debian\shimx64.efi
    ostype Linux
    graphics on
}
